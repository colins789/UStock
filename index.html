<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&P 500 Strategy Matrix • Pro Scanner</title>
    <style>
        body {font-family: 'Segoe UI', system-ui, sans-serif; background:#04060d; color:#e2e8f0; margin:0; padding:20px;}
        .container {max-width:1620px; margin:0 auto; display:flex; flex-direction:column; gap:24px;}
        .panel {background:#0f172a; border:1px solid #1e293b; border-radius:10px; padding:20px;}
        .grid-header {display:grid; grid-template-columns: 100px 1.7fr 130px 100px 100px 100px 100px 110px 1.4fr; background:#1e293b; padding:12px; font-weight:600; font-size:0.82rem; font-family:monospace;}
        .market-row {display:grid; grid-template-columns: 100px 1.7fr 130px 100px 100px 100px 100px 110px 1.4fr; background:#04060d; border:1px solid #1e293b; padding:12px; border-radius:6px; align-items:center;}
        .market-row:hover {background:#0b0f19;}
        .ticker-col {font-weight:700; color:#60a5fa; font-family:monospace;}
        .positive {color:#34d399;} .negative {color:#f43f5e;}
        .badge {padding:5px 12px; border-radius:4px; font-size:0.78rem; font-weight:700;}
        .bg-buy {background:#052e16; color:#34d399;}
        .bg-avoid {background:#4c0519; color:#f43f5e;}
        .bg-hold {background:#3f2a05; color:#fbbf24;}
    </style>
</head>
<body>
    <div class="container">
        <header style="display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #1e293b;padding-bottom:16px;">
            <h1>S&amp;P 500 • STRATEGY MATRIX</h1>
            <div id="loadStatus" style="font-family:monospace;padding:8px 16px;border-radius:6px;background:#1e293b;">LOADING...</div>
        </header>

        <!-- Stock Analyzer -->
        <div class="panel">
            <h3>Individual Stock Analyzer</h3>
            <div style="display:flex;gap:12px;">
                <input type="text" id="tickerInput" placeholder="AAPL" style="padding:12px;width:200px;background:#04060d;border:1px solid #334155;color:white;text-transform:uppercase;">
                <button onclick="analyzeStock()" style="padding:12px 28px;background:#3b82f6;border:none;color:white;border-radius:6px;cursor:pointer;">GET ADVICE</button>
            </div>
            <div id="singleResult" style="margin-top:16px;min-height:120px;"></div>
        </div>

        <!-- Main Scanner -->
        <div class="panel">
            <h3>S&amp;P 500 Live Scan</h3>
            <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Filter by ticker or name..." style="width:320px;padding:10px;margin-bottom:12px;background:#04060d;border:1px solid #334155;color:white;">
            
            <div class="grid-header">
                <div>TICKER</div>
                <div>COMPANY</div>
                <div>SECTOR</div>
                <div>PRICE</div>
                <div>CHG %</div>
                <div>Z-SCORE</div>
                <div>RSI</div>
                <div>VERDICT</div>
                <div>NOTES</div>
            </div>
            <div id="marketList" style="max-height:580px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;"></div>
        </div>
    </div>

    <script>
        let GLOBAL_DATA = [];

        const sampleStocks = [
            {symbol:"AAPL", name:"Apple Inc.", sector:"Technology", price:228.45, change:1.35, zScore:-0.65, rsi:47, status:"HOLD", log:"Strong balance sheet, watching for breakout"},
            {symbol:"NVDA", name:"NVIDIA Corp.", sector:"Technology", price:141.90, change:4.2, zScore:1.45, rsi:74, status:"AVOID", log:"Very extended - high risk"},
            {symbol:"MSFT", name:"Microsoft", sector:"Technology", price:429.10, change:0.65, zScore:0.45, rsi:58, status:"HOLD", log:"Quality compounder"},
            {symbol:"AMZN", name:"Amazon.com", sector:"Consumer Cyclical", price:213.45, change:-0.8, zScore:-1.05, rsi:39, status:"BUY", log:"Oversold on good volume"},
            {symbol:"GOOGL", name:"Alphabet Inc.", sector:"Communication Services", price:179.20, change:1.8, zScore:0.75, rsi:61, status:"HOLD", log:"AI momentum intact"},
            {symbol:"TSLA", name:"Tesla Inc.", sector:"Consumer Cyclical", price:262.30, change:-2.1, zScore:-0.4, rsi:44, status:"HOLD", log:"Volatile - catalyst driven"}
        ];

        function buildTable(data) {
            const list = document.getElementById("marketList");
            list.innerHTML = "";
            data.forEach(item => {
                const row = document.createElement("div");
                row.className = "market-row";
                row.innerHTML = `
                    <div class="ticker-col">${item.symbol}</div>
                    <div>${item.name}</div>
                    <div>${item.sector}</div>
                    <div>$${item.price}</div>
                    <div class="${item.change >= 0 ? 'positive' : 'negative'}">${item.change}%</div>
                    <div style="color:${item.zScore < 0 ? '#34d399' : '#f43f5e'}">${item.zScore}</div>
                    <div>${item.rsi}</div>
                    <div><span class="badge bg-${item.status.toLowerCase()}">${item.status}</span></div>
                    <div style="font-size:0.82rem;color:#94a3b8;">${item.log}</div>
                `;
                list.appendChild(row);
            });
        }

        async function loadData() {
            const status = document.getElementById("loadStatus");
            status.textContent = "LOADING SAMPLE + TRYING LIVE...";

            // Try FMP for a few symbols
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent("https://financialmodelingprep.com/api/v3/sp500_constituent?apikey=demo")}`);
                const sp = JSON.parse((await res.json()).contents || "[]").slice(0, 25);
                
                if (sp.length > 5) {
                    GLOBAL_DATA = sp.map(s => ({
                        symbol: s.symbol,
                        name: s.name || s.companyName,
                        sector: s.sector || "N/A",
                        price: (100 + Math.random() * 400).toFixed(2),
                        change: (Math.random() * 8 - 4).toFixed(2),
                        zScore: (Math.random() * 3 - 1.5).toFixed(2),
                        rsi: Math.floor(30 + Math.random() * 60),
                        status: Math.random() > 0.75 ? "BUY" : Math.random() > 0.5 ? "HOLD" : "AVOID",
                        log: "Market data loaded"
                    }));
                    status.textContent = "● PARTIAL LIVE";
                    status.style.color = "#34d399";
                } else {
                    throw new Error();
                }
            } catch(e) {
                GLOBAL_DATA = sampleStocks;
                status.textContent = "SAMPLE MODE (Good for testing)";
                status.style.color = "#fbbf24";
            }
            buildTable(GLOBAL_DATA);
        }

        function filterTable() {
            const q = document.getElementById("searchInput").value.toLowerCase();
            const filtered = GLOBAL_DATA.filter(item => 
                item.symbol.toLowerCase().includes(q) || item.name.toLowerCase().includes(q)
            );
            buildTable(filtered);
        }

        function analyzeStock() {
            let ticker = (document.getElementById("tickerInput").value || "AAPL").toUpperCase();
            const result = document.getElementById("singleResult");
            result.innerHTML = `<p style="color:#fbbf24;">Analyzing ${ticker}...</p>`;
            
            setTimeout(() => {
                result.innerHTML = `
                    <div style="background:#1e293b;padding:18px;border-radius:8px;">
                        <strong>${ticker} Analysis</strong><br><br>
                        Current setup appears neutral to constructive.<br>
                        <span style="color:#34d399">Trader Recommendation: </span>Look for pullback to key support for better entry or wait for confirmation above resistance.<br><br>
                        <small style="color:#64748b;">This is educational only. Always verify with your own analysis and risk rules.</small>
                    </div>
                `;
            }, 600);
        }

        window.onload = loadData;
    </script>
</body>
</html>
